buildscript {
    ext {
        kotlin_version = '1.9.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate {
        if (project.name == 'app') {
            project.android {
                compileSdk 33
                defaultConfig {
                    minSdk 24
                    targetSdk 33
                    versionCode 4
                    versionName "2.4"
                }
            }
        }
    }
}
